name: worktrace
description: "Local-first developer workspace for students and beginner developers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1

  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  sqlite3: ^3.5.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
